services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://currency:currency@postgres:5432/currency?sslmode=disable
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: currency
      POSTGRES_PASSWORD: currency
      POSTGRES_DB: currency
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U currency -d currency"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
