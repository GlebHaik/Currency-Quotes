http:
  port: "8080"
  read_timeout: 5s
  write_timeout: 10s
  shutdown_timeout: 15s
  request_timeout: 5s

database:
  url: "postgres://currency:currency@localhost:5442/currency?sslmode=disable"
  max_open_conns: 10
  migrations_dir: migrations

provider:
  base_url: "https://api.frankfurter.dev"
  timeout: 5s
  rps: 5
  burst: 5

# How one batch of updates is processed.
updater:
  lock_ttl: 30s
  max_attempts: 3
  retry_backoff: 2s
  max_backoff: 1m
  finalize_timeout: 5s

# How often and how concurrently batches are processed.
background:
  workers: 4
  poll_interval: 1s
  batch_size: 100
  # Claimed batches waiting for a worker; keep the wait well under updater.lock_ttl.
  queue_size: 64
